name: Commerce checks
on:
  pull_request:
  push:
    branches: [feature/account-cart-private-delivery]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: commerce_test
          POSTGRES_DB: commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:commerce_test@127.0.0.1:5432/commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check commerce.js && node --check server.js && node --check sync-assets.js
